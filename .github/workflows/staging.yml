name: Python application

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

#    - name: Check import order with isort
#      run: isort . --check --diff

#    - name: Lint with flake8
#      run: |
#        # Stop build if there are Python syntax errors or undefined names
#        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
#        # Run full flake8 check with complexity and line length settings
#        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check PEP8 formatting with autopep8
      run: autopep8 --diff --recursive .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

#      - name: Run tests
#        run: make test


  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ vars.SANDBOX_EC2_HOST }}
          username: ${{ vars.SANDBOX_EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.SANDBOX_EC2_PATH }}
            git pull origin staging
            chmod +x redeploy.sh
            ./redeploy.sh


