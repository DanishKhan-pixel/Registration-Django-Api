 
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - db

    restart: unless-stopped




  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: pulsse_user
      POSTGRES_PASSWORD: alphapulsse

volumes:
  postgres_data:
